<!-- Screenshot preview modal. One shell, reused for every project's gallery.
     Controlled by assets/js/project-gallery.js. -->
<div class="modal" data-gallery-modal role="dialog" aria-modal="true" aria-labelledby="gallery-title" aria-hidden="true">
  <div class="modal__dialog" tabindex="-1">
    <header class="modal__header">
      <div>
        <p class="modal__kicker" data-gallery-kicker></p>
        <h2 class="modal__title" id="gallery-title" data-gallery-title></h2>
      </div>
      <button class="modal__close" type="button" data-modal-close aria-label="Close preview"></button>
    </header>

    <div class="modal__body">
      <div class="gallery">
        <div class="gallery__stage" data-gallery-stage>
          <img data-gallery-image src="" alt="" width="1440" height="900" decoding="async" />
          <button class="gallery__nav gallery__nav--prev" type="button" data-gallery-prev aria-label="Previous screenshot"></button>
          <button class="gallery__nav gallery__nav--next" type="button" data-gallery-next aria-label="Next screenshot"></button>
        </div>

        <p class="gallery__meta">
          <span class="gallery__caption" data-gallery-caption aria-live="polite"></span>
          <span class="gallery__counter" data-gallery-counter></span>
        </p>

        <div class="gallery__thumbs" data-gallery-thumbs role="group" aria-label="Screenshot thumbnails"></div>
      </div>
    </div>

    <footer class="modal__footer">
      <p class="muted" style="margin-right: auto; font-size: 0.8rem">
        Use the arrow keys to browse, or press <kbd>Esc</kbd> to close.
      </p>
      <button class="btn btn--ghost" type="button" data-modal-close>Close</button>
    </footer>
  </div>
</div>
