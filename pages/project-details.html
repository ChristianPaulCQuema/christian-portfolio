<!DOCTYPE html>
<html lang="en" data-base="..">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Details | Christian Paul Quema</title>
    <meta name="description" content="Full case study for a project by Christian Paul Quema." />
    <meta name="theme-color" content="#070b18" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../assets/images/icons/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/variables.css" />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/animations.css" />
    <link rel="stylesheet" href="../assets/css/pages/projects.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />

    <script src="../assets/js/theme.js"></script>
  </head>

  <body>
    <div class="bg-field" aria-hidden="true"></div>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-component="header"></header>

    <main id="main">
      <!-- Shown until the project data resolves. -->
      <div class="container detail-loading" data-detail-loading>
        <p class="muted">Loading project…</p>
      </div>

      <!-- Shown when the ?project= id is missing or unknown. -->
      <div class="container detail-error" data-detail-error hidden>
        <h1>Project not found</h1>
        <p data-detail-error-message></p>
        <a class="btn btn--primary" href="projects.html">Back to all projects</a>
      </div>

      <div data-detail-content hidden>
        <section class="detail-header">
          <div class="container">
            <ol class="breadcrumbs">
              <li><a href="../index.html">Home</a></li>
              <li><a href="projects.html">Projects</a></li>
              <li aria-current="page" data-detail-crumb></li>
            </ol>

            <p class="eyebrow" data-detail-kicker></p>
            <h1 data-detail-title></h1>
            <div class="detail-header__meta" data-detail-meta></div>
            <p class="lede" data-detail-summary></p>
            <div class="btn-row" style="margin-top: 1.75rem" data-detail-actions></div>
          </div>
        </section>

        <section class="section--tight">
          <div class="container" data-detail-hero></div>
        </section>

        <section class="section" style="padding-top: 0">
          <div class="container">
            <div class="detail-layout">
              <div class="detail-main" data-detail-main></div>
              <aside class="detail-side" data-detail-side aria-label="Project facts"></aside>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer" data-component="footer"></footer>

    <button class="to-top" type="button" data-to-top aria-label="Back to top"></button>

    <div data-component="project-modal"></div>

    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script src="../assets/js/animations.js"></script>
    <script src="../assets/js/project-gallery.js"></script>
    <script src="../assets/js/projects.js"></script>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
